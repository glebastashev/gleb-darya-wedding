<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Приглашение Глеба и Дарьи</title>
  </head>
  <body>
    <script>
      (function () {
        var parts = window.location.pathname.split("/").filter(Boolean);
        var onGithubPages = window.location.hostname.endsWith("github.io");
        var repository = onGithubPages ? parts.shift() : "";
        var guest = parts.join("/");
        var base = repository ? "/" + repository + "/" : "/";
        var target = base + (guest ? "?guest=" + encodeURIComponent(guest) : "");
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
